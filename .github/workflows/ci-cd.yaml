name: ci-cd

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/scripts.yaml"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CERT_MANAGER_VERSION: v1.21.3
  TRAEFIK_CHART_VERSION: 42.4.3

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - name: Image name
        id: ref
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/wisecow"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "image=$name:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: wisecow:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name wisecow -p 4499:4499 wisecow:test
          for i in $(seq 1 10); do
            if curl -fsS http://localhost:4499/ -o cow.html && grep -q '<pre>' cow.html; then
              cat cow.html
              exit 0
            fi
            sleep 1
          done
          docker logs wisecow
          exit 1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.ref.outputs.name }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
